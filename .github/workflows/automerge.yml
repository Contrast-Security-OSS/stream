name: automerge
on:
  pull_request:
    types:
      - labeled
      - opened
  check_suite:
    types:
      - completed
permissions:
  contents: read

jobs:
  automerge:
    permissions:
      contents: write  # for pascalgn/automerge-action to merge PR
      pull-requests: write  # for pascalgn/automerge-action to remove PR labels
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: automerge
        uses: "pascalgn/automerge-action@04dfc9eae2586d19b7362d4f6413c48135d9c25a" # v0.14.3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_METHOD: squash
          MERGE_LABELS: automerge